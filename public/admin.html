<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Pointer Admin · Editorial Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: dark; --page:#0b0e13; --panel:#151a21; --raised:#191f28; --text:#f8fafc;
      --muted:#94a3b8; --subtle:#718198; --line:rgba(148,163,184,.16); --red:#dc1b3f;
      --red-soft:rgba(220,27,63,.12); --input:#0f1318; --shadow:rgba(0,0,0,.4);
    }
    :root[data-theme="light"] {
      color-scheme:light; --page:#EAF0F7; --panel:#FFFFFF; --raised:#f3f6fa; --text:#0B1220;
      --muted:#475569; --subtle:#64748b; --line:rgba(15,23,42,.1); --red:#C8102E;
      --red-soft:rgba(200,16,46,.1); --input:#fff; --shadow:rgba(15,23,42,.16);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--page);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:13px}
    button,input,select,textarea{font:inherit}
    button,a{ -webkit-tap-highlight-color:transparent}
    a{color:inherit;text-decoration:none}
    button{color:inherit}
    :focus-visible{outline:2px solid var(--red);outline-offset:2px}
    .sidebar{position:fixed;inset:0 auto 0 0;width:264px;z-index:20;display:flex;flex-direction:column;padding:24px 20px 20px;background:#0b0e13;border-right:1px solid rgba(148,163,184,.16);color:#f8fafc}
    .brand{display:flex;align-items:center;gap:10px}
    .target{position:relative;width:32px;height:32px;flex:none;border:5px solid var(--red);border-radius:50%;background:#fff}
    .target:before{content:"";position:absolute;inset:4px;border:3px solid #0b0e13;border-radius:50%}
    .target:after{content:"";position:absolute;inset:0;margin:auto;width:6px;height:6px;border-radius:50%;background:var(--red)}
    .brand-name{font-size:21px;font-weight:900;letter-spacing:-.04em;line-height:1}
    .admin-label{display:block;color:#94a3b8;font-size:10px;font-weight:800;letter-spacing:.04em;margin-top:5px}
    .brand-caption{margin:16px 8px 0;color:#94a3b8;font-size:10px}
    .workspace-label{margin:48px 0 10px;color:#94a3b8;font-size:10px;font-weight:800}
    .nav{display:grid;gap:5px}
    .nav-link{position:relative;min-height:48px;display:flex;align-items:center;gap:14px;padding:0 12px;border-radius:9px;color:#94a3b8;font-size:13px;font-weight:500}
    .nav-link svg{width:18px;height:18px;flex:none}
    .nav-link:hover{background:#12171e;color:#fff}
    .nav-link.active{background:rgba(220,27,63,.12);color:#fff;font-weight:700}
    .nav-link.active:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 2px 2px 0;background:var(--red)}
    .nav-link.active svg{color:#ff4665}
    .nav-divider{height:1px;background:rgba(148,163,184,.2);margin:10px 0}
    .sidebar-bottom{margin-top:auto}
    .user-card{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid rgba(148,163,184,.2);border-radius:9px;background:#151a21}
    .avatar{width:36px;height:36px;display:grid;place-items:center;flex:none;border-radius:50%;background:rgba(220,27,63,.13);color:#ff4968;font-weight:800}
    .user-name{font-size:11px;font-weight:700}
    .user-team{margin-top:4px;color:#94a3b8;font-size:9px}
    .sidebar-copy{margin:16px 0 0;color:#94a3b8;font-size:9px}
    .main{min-height:100vh;margin-left:264px;padding:28px 32px 38px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
    .crumb{color:var(--muted);font-size:10px;font-weight:600}
    .top-right{display:flex;align-items:center;gap:15px}
    .workspace-caption{color:var(--muted);font-size:9px;font-weight:800}
    .theme-btn,.menu-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--panel);cursor:pointer}
    .menu-btn{display:none;border-radius:9px}
    .page-title{margin:0;font-size:28px;line-height:1.1;font-weight:850;letter-spacing:-.03em}
    .page-description{margin:8px 0 20px;color:var(--muted);font-size:11px}
    .panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
    .panel-head{min-height:45px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;border-bottom:1px solid var(--line)}
    .panel-title{margin:0;font-size:13px;font-weight:750}
    .panel-title:before{content:"";display:inline-block;width:2px;height:15px;margin-right:9px;vertical-align:-3px;background:var(--red)}
    .muted-small{color:var(--muted);font-size:9px}
    .episode-form{padding:18px}
    .form-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:15px 16px}
    .field{grid-column:span 12;min-width:0}
    .field.span-9{grid-column:span 9}
    .field.span-8{grid-column:span 8}
    .field.span-4{grid-column:span 4}
    .field.span-3{grid-column:span 3}
    .field label,.field-label{display:block;margin:0 0 7px;font-size:10px;font-weight:650}
    .field input,.field select,.field textarea,.search-input,.settings-input{
      width:100%;min-height:38px;border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:var(--input);color:var(--text);font-size:10px
    }
    .field textarea{min-height:70px;resize:vertical;line-height:1.5}
    .field select{color-scheme:inherit}
    .field input::placeholder,.field textarea::placeholder{color:var(--subtle)}
    .field-help{margin:6px 0 0;color:var(--muted);font-size:8px;line-height:1.5}
    .field-error{min-height:0;margin-top:5px;color:#ff526e;font-size:9px}
    .video-preview{margin-top:8px;max-width:380px;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8px;background:#0F172A;overflow:hidden}
    .video-preview iframe,.video-preview video{width:100%;height:100%;border:0;object-fit:contain}
    .preview-empty{height:100%;display:grid;place-items:center;color:#94a3b8;font-size:10px}
    .source-badge{display:inline-flex;margin:7px 0 0;padding:4px 8px;border-radius:999px;background:var(--red-soft);color:#ff657c;font-size:8px;font-weight:700}
    .thumbnail-drop{min-height:86px;display:grid;place-items:center;border:1px dashed #536173;border-radius:7px;background:var(--input);text-align:center;cursor:pointer}
    .thumbnail-drop.dragover{border-color:var(--red);background:var(--red-soft)}
    .drop-copy{color:var(--text);font-size:9px;font-weight:600}
    .drop-help{margin-top:5px;color:var(--muted);font-size:8px}
    .thumbnail-preview{display:none;width:min(100%,360px);margin-top:9px;aspect-ratio:16/9;border:1px solid var(--line);border-radius:7px;background:#0F172A;object-fit:cover}
    .thumb-url{margin-top:8px!important}
    .form-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 18px;border-top:1px solid var(--line)}
    .form-footer-note{color:var(--muted);font-size:8px}
    .button-row{display:flex;gap:9px}
    .btn{min-height:34px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:9px;font-weight:700;cursor:pointer}
    .btn:hover{background:var(--raised)}
    .btn-red{border-color:var(--red);background:var(--red);color:#fff}
    .btn-red:hover{background:#ec2448}
    .btn:disabled{opacity:.55;cursor:wait}
    .recent-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}
    .eyebrow{margin:0 0 5px;color:#ff4665;font-size:8px;font-weight:800}
    .recent-title{margin:0;font-size:17px;font-weight:800}
    .link-red{display:inline-flex;align-items:center;gap:8px;color:#ff4665;font-size:9px;font-weight:700}
    .table-wrap{overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:650px}
    th{padding:11px 14px;color:var(--muted);font-size:8px;text-align:left;font-weight:750}
    td{padding:10px 14px;border-top:1px solid var(--line);font-size:9px;vertical-align:middle}
    .episode-thumb{position:relative;width:72px;height:41px;border-radius:5px;background:#0F172A center/cover no-repeat}
    .duration-tag{position:absolute;right:3px;bottom:3px;padding:2px 4px;border-radius:3px;background:rgba(0,0,0,.8);color:#fff;font-size:7px}
    .table-title{font-size:9px;font-weight:700}
    .table-sub{margin-top:4px;color:var(--muted);font-size:8px}
    .category-pill,.status-pill{display:inline-flex;padding:4px 7px;border-radius:999px;background:var(--red-soft);color:#ff657c;font-size:8px}
    .table-action{border:0;background:none;color:var(--text);font-size:9px;cursor:pointer}
    .table-action.delete{color:#ff4665}
    .table-foot{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:8px}
    .empty{padding:28px;text-align:center;color:var(--muted);font-size:11px}
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
    .search-input{width:min(360px,100%);background:var(--panel)}
    .toolbar select{min-height:38px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--panel);color:var(--text);font-size:10px}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
    .stat-card{padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
    .stat-name{color:var(--muted);font-size:9px}
    .stat-value{margin-top:8px;font-size:23px;font-weight:800}
    .dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .list-row{padding:12px 16px;border-top:1px solid var(--line)}
    .message-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .message-name{font-size:10px;font-weight:700}
    .message-copy{margin-top:5px;color:var(--muted);font-size:9px;line-height:1.5;overflow-wrap:anywhere}
    .message-copy.collapsed{max-height:4.05em;overflow:hidden}
    .message-expand{margin-top:4px;padding:0;color:var(--red)}
    .message-actions{display:flex;gap:8px}
    .category-list{display:grid;gap:8px}
    .category-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
    .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px}
    .login-wrap{min-height:85vh;display:grid;place-items:center}
    .login-card{width:min(100%,390px);padding:26px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}
    .login-card h1{margin:22px 0 6px;font-size:22px}
    .toast{position:fixed;right:24px;bottom:22px;z-index:80;max-width:calc(100vw - 48px);padding:12px 16px;border:1px solid var(--line);border-radius:9px;background:var(--panel);box-shadow:0 12px 30px var(--shadow);font-size:11px}
    .toast.error{border-color:rgba(255,70,101,.5);color:#ff657c}
    .modal-backdrop{position:fixed;inset:0;z-index:70;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.7)}
    .modal-backdrop.open{display:grid}
    .confirm-box{width:min(100%,380px);padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
    .confirm-box h3{margin:0 0 8px;font-size:16px}
    .confirm-box p{color:var(--muted);font-size:11px;line-height:1.5}
    .mobile-scrim{display:none}
    @media(max-width:1100px){.main{padding:24px 22px}.stats{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:1023px){
      .sidebar{transform:translateX(-100%);transition:transform .2s ease}
      body.drawer-open .sidebar{transform:translateX(0)}
      .mobile-scrim{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.58)}
      body.drawer-open .mobile-scrim{display:block}
      .main{margin-left:0;padding:18px}
      .menu-btn{display:grid}
      .topbar{justify-content:flex-start}
      .top-right{margin-left:auto}
    }
    @media(max-width:680px){
      .main{padding:14px}
      .workspace-caption{display:none}
      .page-title{font-size:24px}
      .field.span-9,.field.span-8,.field.span-4,.field.span-3{grid-column:span 12}
      .form-footer{align-items:flex-start;flex-direction:column}
      .button-row{width:100%}.button-row .btn{flex:1}
      .stats{gap:9px}.stat-card{padding:12px}
      .dashboard-grid,.settings-grid{grid-template-columns:1fr}
      .recent-head{align-items:flex-start}
    }
  </style>
</head>
<body>
  <div class="mobile-scrim" id="mobile-scrim"></div>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#dashboard" aria-label="The Pointer Admin">
      <span class="target" aria-hidden="true"></span>
      <span><span class="brand-name">THE POINTER</span><span class="admin-label">ADMIN</span></span>
    </a>
    <p class="brand-caption">A Delbuster Media Production</p>
    <p class="workspace-label">WORKSPACE</p>
    <nav class="nav" aria-label="Admin workspace">
      <a class="nav-link" href="#dashboard" data-route="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
      <a class="nav-link active" href="#add-episode" data-route="add-episode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>Add New Episode</a>
      <a class="nav-link" href="#manage-episodes" data-route="manage-episodes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7.5 18.5 4l2 3.5L6 11zM4 7.5V20h16V7.5M9 10l2-4"/></svg>Manage Episodes</a>
      <a class="nav-link" href="#categories" data-route="categories"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 13 11 22 2 13V4h9z"/><circle cx="7" cy="9" r="1.2"/><path d="m13 3 8 8"/></svg>Categories</a>
      <a class="nav-link" href="#settings" data-route="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6h14M5 12h14M5 18h14"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg>Settings</a>
      <div class="nav-divider"></div>
      <button class="nav-link" id="logout-button" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 17l5-5-5-5M15 12H3M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg>Logout</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="user-card"><span class="avatar">AU</span><span><span class="user-name">Admin User</span><span class="user-team">Delbuster Media Team</span></span></div>
      <p class="sidebar-copy">© 2026 The Pointer · Editorial workspace</p>
    </div>
  </aside>

  <main class="main" id="app">
    <div class="topbar">
      <button class="menu-btn" id="menu-button" aria-label="Open menu" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="crumb" id="breadcrumb">Dashboard &gt; Episodes &gt; Add New</div>
      <div class="top-right"><span class="workspace-caption">EDITORIAL WORKSPACE</span><button class="theme-btn" id="theme-button" aria-label="Toggle theme" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button></div>
    </div>
    <section id="view-root"></section>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="modal-backdrop" id="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="confirm-box"><h3 id="confirm-title">Confirm action</h3><p id="confirm-copy"></p><div class="button-row"><button class="btn" id="confirm-cancel" type="button">Cancel</button><button class="btn btn-red" id="confirm-accept" type="button">Delete</button></div></div>
  </div>
  <script src="/js/media.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
